services:
  web:
    build: .
    restart: always
    links:
      - redis
#     - mcaptcha
#     - meilisearch
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - internal_network
      - external_network
    # env_file:
    #   - .config/docker.env
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro

  nginx:
    image: nginx:1.28-alpine
    restart: always
    depends_on:
      - web
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        update_config() {
          if [ -f /etc/letsencrypt/live/kho.cc.cd/fullchain.pem ] && [ -f /etc/letsencrypt/live/kho.cc.cd/privkey.pem ]; then
            cp /opt/nginx-config/https.conf /etc/nginx/conf.d/default.conf
          else
            cp /opt/nginx-config/init.conf /etc/nginx/conf.d/default.conf
          fi
        }

        update_config

        while :; do
          sleep 6h & wait $${!};
          update_config;
          nginx -s reload;
        done &
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal_network
      - external_network
    volumes:
      - ./docker/nginx:/opt/nginx-config:ro
      - certbot_www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt

  certbot:
    image: certbot/certbot:latest
    restart: always
    depends_on:
      - nginx
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
    networks:
      - external_network
    volumes:
      - certbot_www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt

  redis:
    restart: always
    image: redis:7-alpine
    command: ["redis-server", "--port", "6313", "--appendonly", "yes"]
    networks:
      - internal_network
      - external_network
    ports:
      - "6313:6313"
    volumes:
      - ./redis:/data
    healthcheck:
      test: "redis-cli -p 6313 ping"
      interval: 5s
      retries: 20

