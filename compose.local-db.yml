# このconfigは、 dockerでMisskey本体を起動せず、 redisとpostgresql などだけを起動します

services:
  redis:
    restart: always
    image: redis:7-alpine
    command: ["redis-server", "--port", "6313", "--appendonly", "yes"]
    ports:
      - "6313:6313"
    volumes:
      - ./redis:/data
    healthcheck:
      test: "redis-cli -p 6313 ping"
      interval: 5s
      retries: 20

  db:
    restart: always
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    env_file:
      - .config/docker.env
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

